name: Grow pond
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/pond.py
      - .github/workflows/pond.yml

concurrency: pond

jobs:
  pond:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Draw the pond
        run: python3 scripts/pond.py --login "${{ github.repository_owner }}" --output pond/pond.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add pond/
          git diff --staged --quiet || (git commit -m "chore: update koi pond" && git push)
