name: Generate Koi
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  koi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: yalongwastaken/git-koi@main
        with:
          login: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: asagi
      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add koi/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update daily koi GIF" && git push)
